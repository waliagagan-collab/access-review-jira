modules:
  jira:adminPage:
    - key: access-review-page
      resource: main
      render: native
      resolver:
        function: resolver
      title: Access Review
  scheduledTrigger:
    # The weekly personal data report: each run does a slice of it, or
    # nothing when this week's report is done.
    - key: personal-data-report
      function: personal-data
      interval: hour
  consumer:
    - key: scan-consumer
      queue: scan-queue
      # @forge/events v2+ invokes this function directly. The deprecated
      # `resolver:` form belongs to v1.x and makes the queue push fail.
      function: scan-worker
  function:
    - key: resolver
      handler: index.handler
    - key: scan-worker
      handler: worker.handler
      # Slices stop themselves at SLICE.softBudgetMs (240s); this is the hard
      # ceiling that leaves room for the final storage writes of a slice. Long
      # slices keep a snapshot well inside Forge's limit of 1,000 queue pushes
      # in one chain.
      timeoutSeconds: 300
    - key: personal-data
      handler: privacy.scheduled
      # Slices stop themselves at SOFT_BUDGET_MS (40 s); this is the hard ceiling.
      timeoutSeconds: 60
resources:
  - key: main
    path: src/frontend/index.jsx
  # Custom UI resource rendered inside a UI Kit <Frame>: its only job is the
  # evidence download, which UI Kit components cannot trigger themselves.
  - key: export-frame
    path: static/export
app:
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true
  id: ari:cloud:ecosystem::app/37b81c92-ff57-40a7-8706-f459ac83d2d1
permissions:
  scopes:
    # Every scope that touches Jira is read-only. There is deliberately no
    # write scope, so the platform itself prevents this app from changing
    # anything. report:personal-data only sends Atlassian the account IDs the
    # app keeps.
    - read:jira-user # confirms the person using the app is a Jira administrator (/mypermissions, as that user)
    - read:jira-work # recent issue activity: who did what, and when
    - read:application-role:jira # which groups grant which Jira product, and Atlassian's seat counts
    - read:group:jira # every group on the site and its members
    - read:user:jira # active flag and account type, to leave out bots and customers; names and emails at display time
    - read:avatar:jira # required alongside read:user:jira by the group-member endpoint
    - storage:app
    - report:personal-data # the weekly report of stored account IDs, so data of closed accounts is erased
